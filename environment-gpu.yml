# Variante GPU del ambiente `mlfpga` — para entrenar en servidor con GPU NVIDIA
# (p.ej. atalanta: 2× A100-PCIE-40GB). Idéntico a environment.yml salvo que torch
# usa build CUDA en vez de +cpu.
#
# Crear:   conda env create -f environment-gpu.yml
# Activar: conda activate mlfpga
#
# torch 2.5.1 + CUDA 12.1 (cu121). Requiere driver NVIDIA >= 525.
#   - Si el driver es más viejo, cambiar cu121 -> cu118 (torch==2.5.1+cu118).
#   - Verificar driver/CUDA con: nvidia-smi   (esquina superior derecha)
name: mlfpga
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - numpy==1.26.4
      - "setuptools<70"
      - dependencies==2.0.1
      - brevitas==0.12.1
      - qonnx==0.4.0
      - hls4ml==1.2.0
      - onnx==1.17.0
      - onnxruntime==1.23.2
      - protobuf==3.20.3
      # export QONNX -> FINN (brevitas.export.export_qonnx)
      - onnxscript==0.7.1
      - onnxoptimizer==0.4.2
      - matplotlib
      - pandas
      - seaborn
      - scikit-learn
